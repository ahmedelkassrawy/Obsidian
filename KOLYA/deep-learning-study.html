<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deep Learning Study</title>
<style>
:root{
  --bg:#f6f5f1; --card:#fff; --ink:#1c1e21; --muted:#5d636b; --line:#e2dfd7;
  --accent:#2b4fb5; --accent-soft:#e9eefb; --gold:#a97400; --gold-soft:#fff5d9;
  --ok:#1b7a3d; --ok-soft:#e4f4ea; --bad:#b3261e; --bad-soft:#fdecea; --fx:#f1f3f8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --card:#1f2226; --ink:#ececec; --muted:#a2a7ae; --line:#34383e;
    --accent:#90aeff; --accent-soft:#222d47; --gold:#f2c14e; --gold-soft:#39301c;
    --ok:#7fd79a; --ok-soft:#1c3326; --bad:#ff8f85; --bad-soft:#3a2220; --fx:#272b31;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --card:#1f2226; --ink:#ececec; --muted:#a2a7ae; --line:#34383e;
  --accent:#90aeff; --accent-soft:#222d47; --gold:#f2c14e; --gold-soft:#39301c;
  --ok:#7fd79a; --ok-soft:#1c3326; --bad:#ff8f85; --bad-soft:#3a2220; --fx:#272b31;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow-wrap:break-word}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 90px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
nav button,.sub button,.btn{font:inherit;font-size:.93rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:36px}
nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav .timer{margin-left:auto;font-variant-numeric:tabular-nums}
nav .timer.run{border-color:var(--accent);color:var(--accent)}
.crumb{color:var(--muted);font-size:.87rem;margin:10px 0 6px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.sub button.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
h1{font-size:1.9rem;line-height:1.2;margin:.6em 0 .2em}
h2{font-size:1.2rem;margin:0 0 .5em}
h3{font-size:1rem;margin:1em 0 .3em}
.muted{color:var(--muted);font-size:.92rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:10px 0}
.qno{display:inline-block;font-size:.8rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 10px;margin-bottom:6px}
.qt{font-size:1.06rem;font-weight:600;margin:0 0 10px}
/* stepper */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar .n{font-variant-numeric:tabular-nums;font-weight:600}
.prog{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.dots button{width:30px;height:30px;font-size:.78rem;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;padding:0}
.dots button.cur{outline:2px solid var(--accent);outline-offset:1px}
.dots button.r{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.dots button.w{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.next2{display:flex;justify-content:flex-end;margin-top:12px}
/* mcq */
.opt{display:flex;gap:10px;width:100%;text-align:left;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:6px 0;cursor:pointer}
.opt b{color:var(--accent);min-width:1.1em}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.right b{color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt.wrong b{color:var(--bad)}
.opt:disabled{cursor:default}
.why{border-left:4px solid var(--accent);background:var(--accent-soft);padding:9px 13px;border-radius:0 8px 8px 0;margin-top:10px}
/* steps */
.use{background:var(--fx);border-radius:8px;padding:8px 12px;margin:0 0 10px;overflow-x:auto}
ol.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
ol.steps>li{counter-increment:s;position:relative;padding:0 0 14px 40px;border-left:2px solid var(--line);margin-left:13px;padding-left:24px}
ol.steps>li:last-child{border-left-color:transparent;padding-bottom:4px}
ol.steps>li::before{content:counter(s);position:absolute;left:-14px;top:0;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--card);font-size:.82rem;font-weight:700;display:flex;align-items:center;justify-content:center}
ol.steps>li.hid{display:none}
.st-h{font-weight:600}
.st-why{color:var(--muted);font-size:.93rem}
.fx{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",serif;font-size:1.07em;background:var(--fx);border-radius:7px;padding:6px 10px;margin:5px 0;overflow-x:auto;display:block;max-width:100%}
.i{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",serif;font-size:1.06em}
.ans{background:var(--ok-soft);border:1px solid var(--ok);border-radius:9px;padding:9px 13px;margin-top:8px;font-weight:600;overflow-x:auto}
.ans.hid,.reveal.hid,.tip.hid{display:none}
.tip{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:0 8px 8px 0;padding:9px 13px;margin:10px 0;font-size:.95rem}
.warn{background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:0 8px 8px 0;padding:9px 13px;margin:10px 0;font-size:.95rem}
.chk{display:inline-block;font-size:.76rem;font-weight:600;border:1px dashed var(--gold);color:var(--gold);border-radius:999px;padding:0 8px;white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* matrix and fraction */
.mx{display:inline-grid;gap:0 11px;vertical-align:middle;padding:1px 7px;margin:2px;border-left:1.6px solid currentColor;border-right:1.6px solid currentColor;border-radius:6px;text-align:right;line-height:1.35;font-variant-numeric:tabular-nums}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
/* essay points */
.key{font-weight:600;border-left:4px solid var(--ok);padding:4px 0 4px 12px;margin:0 0 10px}
ul.pts{list-style:none;margin:0;padding:0}
ul.pts>li{padding:8px 0;border-top:1px dashed var(--line)}
ul.pts>li:first-child{border-top:0}
ul.pts b.h{display:block;color:var(--accent)}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--fx)}
.fig{margin:12px 0;text-align:center}
.fig img{max-width:100%;height:auto;background:#fff;border-radius:8px;border:1px solid var(--line);padding:4px}
.fig figcaption{font-size:.82rem;color:var(--muted);margin-top:3px}
svg.dg{width:100%;height:auto;display:block;margin:10px 0}
svg.dg text{fill:var(--ink);font:13px "Segoe UI",system-ui,sans-serif}
svg.dg text.s{font-size:11px;fill:var(--muted)}
svg.dg .bx{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.3}
svg.dg .bx2{fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.3}
svg.dg .bx3{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.3}
svg.dg .ln{stroke:var(--muted);stroke-width:1.5;fill:none}
svg.dg .a{stroke:var(--accent);stroke-width:2;fill:none}
svg.dg .b{stroke:var(--bad);stroke-width:2;fill:none}
svg.dg .g{stroke:var(--ok);stroke-width:2;fill:none}
svg.dg .dot{fill:var(--accent)}
svg.dg .ah{fill:var(--muted)}
/* cheatsheet */
.ch-tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.chrow{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:4px 14px;padding:8px 0;border-top:1px dashed var(--line)}
.chrow:first-of-type{border-top:0}
.chrow .l{font-weight:600}
.chrow .v{min-width:0;overflow-x:auto}
.chrow .nt{color:var(--muted);font-size:.87rem;margin-top:2px}
body.selftest .chrow .v .body{filter:blur(7px);cursor:pointer;user-select:none}
body.selftest .chrow .v.shown .body{filter:none}
@media (max-width:600px){.chrow{grid-template-columns:minmax(0,1fr)} nav{position:static}}
.badge{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--gold-soft);color:var(--gold)}
a.go,button.go{color:var(--accent);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline}
.golist{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px}
.sheets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.sheets button{text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer}
.sheets b{display:block}
details{margin:10px 0}
summary{cursor:pointer;font-weight:600}
.break{background:var(--ok-soft);border:1px solid var(--ok);padding:10px 14px;border-radius:9px;margin:10px 0}
@media print{
  nav,.crumb,.sub,.ch-tools{display:none!important}
  body{background:#fff;font-size:12px;line-height:1.35}
  .card{break-inside:avoid;border-color:#bbb;padding:8px 10px;margin:6px 0}
  body.selftest .chrow .v .body{filter:none}
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path class="ah" d="M0,0 L7,3 L0,6 z" fill="#777"/></marker></defs></svg>
<div class="wrap">
<nav id="nav"></nav>
<div class="crumb" id="crumb"></div>
<div id="brk"></div>
<main id="main"></main>
</div>
<script>
/* helpers used by the content files */
const M=(rows)=>`<span class="mx" style="grid-template-columns:repeat(${rows[0].length},auto)">${rows.flat().map(c=>`<span>${c}</span>`).join('')}</span>`;
const Fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const FX=(s)=>`<span class="fx">${s}</span>`;
const I=(s)=>`<span class="i">${s}</span>`;
const CHK=`<span class="chk">check against your lecture</span>`;
const Fig=(id,cap)=>`<figure class="fig"><img src="${FIGS[id]}" alt="${cap}" loading="lazy"><figcaption>${cap}</figcaption></figure>`;
const T=(head,rows)=>`<div class="tbl"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const SHEETS=[];
let TRICKS=[], SOURCE_NOTES=[];
</script>

mcq:[
['Deep learning is a subfield of machine learning that uses:',['Artificial neural networks with multiple layers','Only manually written rules','Database tables without learning','Simple sorting algorithms'],0,'"Deep" literally means many layers of a neural network.'],
['A key feature of deep learning is its ability to:',['Avoid all training data','Automatically learn hierarchical representations','Use only one neuron','Eliminate the need for model evaluation'],1,'Layers build features on top of features, with no hand-designed features needed.'],
['In hierarchical feature learning, low-level features commonly include:',['Complete semantic concepts','Edges and textures','Final decisions','Natural-language paragraphs'],1,'Early layers see simple patterns: edges and textures. Concepts come in later layers.'],
['End-to-end learning means that a model can:',['Learn directly from raw data and optimize processing steps together','Use no input data','Require manual design of every feature','Perform only unsupervised clustering'],0,'Raw input goes in, the answer comes out, and every stage is trained together against one loss.'],
['The basic computational operation of an artificial neuron is to:',['Sort its inputs','Compute a weighted sum, add a bias, and apply an activation function','Store an image file','Randomly select an output'],1,'z = Σwᵢxᵢ + b, then output f(z).'],
['Which neural-network layer receives the raw data?',['Output layer','Hidden layer','Input layer','Loss layer'],2,'The input layer takes the raw data. "Loss layer" is a distractor: loss is a function, not a layer.'],
['The main purpose of a bias is to:',['Adjust the neuron output independently of the inputs','Determine the number of training examples','Replace all weights','Set the learning rate'],0,'Bias is added regardless of the inputs, so it shifts the output even when every input is 0.'],
['Which activation function is defined as f(x) = max(0, x)?',['Sigmoid','Tanh','ReLU','Softmax'],2,'ReLU: negative becomes 0, positive stays the same.'],
['A feedforward neural network is characterized by information that:',['Moves only forward from input to output','Always moves in cycles','Has no output layer','Moves backward only'],0,'No loops. Cycles are what make a network recurrent (RNN).'],
['The loss function measures:',['The number of hidden layers','The difference between model predictions and true values','The size of the dataset','The number of filters'],1,'Loss is a score of how wrong the model is. Training tries to make it small.'],
['Backpropagation is used to:',['Generate input data','Propagate error backward to compute gradients and update weights','Convert images into text','Remove the output layer'],1,'It applies the chain rule from the output back to the input to get every gradient.'],
['CNNs are especially designed for:',['Structured grid data such as images and videos','Sequential text only','Financial tables only','Random number generation'],0,'An image is a grid of pixels, and convolution exploits that grid.'],
['In a CNN, parameter sharing means that:',['The same filter is used across different image regions','Every image has different network weights','All filters are removed','Each pixel has a unique network'],0,'One filter slides everywhere, so an edge detector works in any part of the image and there are fewer parameters.'],
['Which pooling operation selects the largest value in a local region?',['Average pooling','Max pooling','Global normalization','Flattening'],1,'Max pooling keeps the maximum. Average pooling keeps the mean.'],
['RNNs are particularly suitable for sequential data because they:',['Maintain a hidden state carrying information from previous inputs','Ignore the order of inputs','Have no connections between time steps','Process only images'],0,'The hidden state is the memory passed from one step to the next.'],
['Which RNN difficulty occurs when gradients become extremely small during BPTT?',['Exploding gradients','Vanishing gradients','Parameter sharing','Data augmentation'],1,'Small means vanishing. Huge means exploding.'],
['An LSTM uses which three gates, according to the lecture?',['Input, forget and output gates','Max, min and average gates','Query, key and value gates','Generator, discriminator and output gates'],0,'Query, key and value belong to attention. Generator and discriminator belong to GANs.'],
['A GAN consists of:',['An encoder and decoder only','A generator and a discriminator','A CNN and a pooling layer only','Two input layers'],1,'The generator creates fakes and the discriminator judges them.'],
['The core innovation of Transformer networks described in the lecture is:',['Max pooling','Self-attention','Recurrent feedback loops','Dropout'],1,'Every token can look directly at every other token. Transformers removed the recurrent loops.'],
['Which is an ethical consideration in deep learning?',['Bias and fairness in training data','Increasing filter size only','Choosing batch size','Selecting a hidden-state dimension'],0,'The other three are technical hyperparameters. Biased data leads to unfair decisions.'],
],
num:[
{t:'Weighted sum of a neuron',q:`x₁ = 2, x₂ = 3, w₁ = 0.5, w₂ = −1, b = 1. Calculate the net input.`,use:FX('z = w₁x₁ + w₂x₂ + b'),steps:[
['Multiply each input by its weight','w₁x₁ = 0.5 × 2 = 1<br>w₂x₂ = (−1) × 3 = −3','Each weight scales its own input.'],
['Add the products','1 + (−3) = −2',''],
['Add the bias','z = −2 + 1 = −1','The bias comes last and does not multiply anything.']],ans:'z = −1'},
{t:'ReLU activation',q:`The net input is −2.5. Find the ReLU output, f(x) = max(0, x).`,use:FX('f(x) = max(0, x)'),steps:[
['Substitute','f(−2.5) = max(0, −2.5)',''],
['Take the larger value','0 is larger than −2.5, so the result is 0','Any negative input gives 0, so the neuron is "off".']],ans:'f(−2.5) = 0'},
{t:'Sigmoid activation',q:`Net input z = 0. Find σ(z) = 1 / (1 + e<sup>−z</sup>).`,use:FX(`σ(z) = ${Fr('1','1 + e<sup>−z</sup>')}`),steps:[
['Substitute z = 0',`σ(0) = ${Fr('1','1 + e<sup>0</sup>')}`,''],
['Use e⁰ = 1',`σ(0) = ${Fr('1','1 + 1')} = ${Fr('1','2')}`,'Anything to the power 0 equals 1.']],ans:'σ(0) = 0.5',tip:'Worth memorising: sigmoid at 0 is exactly 0.5, the midpoint of its range.'},
{t:'Tanh activation',q:`Net input z = 0.5. Find tanh(0.5).`,use:FX(`tanh(z) = ${Fr('e<sup>z</sup> − e<sup>−z</sup>','e<sup>z</sup> + e<sup>−z</sup>')}`),steps:[
['Compute both exponentials','e<sup>0.5</sup> ≈ 1.6487<br>e<sup>−0.5</sup> ≈ 0.6065','Use the eˣ key on your calculator.'],
['Numerator (subtract)','1.6487 − 0.6065 = 1.0422',''],
['Denominator (add)','1.6487 + 0.6065 = 2.2552',''],
['Divide','1.0422 / 2.2552 ≈ 0.4621','The result must lie between −1 and 1, which is a quick sanity check.']],ans:'tanh(0.5) ≈ 0.4621'},
{t:'CNN convolution',q:`Patch = ${M([[1,2,0],[0,1,3],[2,1,0]])} and filter = ${M([[1,0,'−1'],[1,0,'−1'],[1,0,'−1']])}. Find the dot product at this position.`,use:FX('Output = Σ (patch cell × matching filter cell)'),steps:[

['Row 2','0×1 + 1×0 + 3×(−1) = −3',''],
['Row 3','2×1 + 1×0 + 0×(−1) = 2',''],

{t:'CNN output size',q:`Input 8×8, filter 3×3, stride 1, valid padding. Find the output height and width.`,use:FX(`O = ${Fr('N − F + 2P','S')} + 1`),steps:[

['Calculate','O = 5 + 1 = 6','The filter fits in 6 positions along each side.']],ans:'6 × 6'},

{t:'RNN hidden-state update',q:`hₜ = tanh(Wxₜ + Uhₜ₋₁ + b), with W = 2, xₜ = 1, U = 0.5, hₜ₋₁ = 0.4, b = 0.1. Find hₜ.`,use:FX('hₜ = tanh(Wxₜ + Uhₜ₋₁ + b)'),steps:[
['Input term','Wxₜ = 2 × 1 = 2','How the new input affects the state.'],
['Memory term','Uhₜ₋₁ = 0.5 × 0.4 = 0.2','How the previous state carries forward.'],

['Apply tanh','tanh(2.3) ≈ 0.9801','Calculator: hyp then tan, in any mode, or use the eˣ formula.']],ans:'hₜ ≈ 0.9801'},
{t:'RNN output',q:`yₜ = Vhₜ + c, with V = 3, hₜ = 0.4, c = −0.2. Find yₜ.`,use:FX('yₜ = Vhₜ + c'),steps:[

{t:'Self-attention softmax',q:`One query has dot-product scores [1, 0] with two keys. Find the softmax attention weights.`,use:FX(`weightᵢ = ${Fr('e<sup>sᵢ</sup>','Σⱼ e<sup>sⱼ</sup>')}`),steps:[

{q:'Define deep learning and explain its key features. How does it differ from traditional machine learning in feature extraction?',key:'Deep learning is machine learning with multi-layer neural networks that learn their own features from data.',pts:[

['Key feature: end-to-end learning','The model goes from raw data to the answer and optimises all stages together.'],

['The difference in feature extraction','Traditional ML depends on humans to design the features, then trains a model on them. Deep learning learns the features automatically during training.'],
['Example','To detect faces, traditional ML needs hand-built features for eyes or edges. A CNN discovers them from the pixels.']]},
{q:'Explain hierarchical feature learning. Describe the progression from raw input to low-level, mid-level and abstract features.',key:'Each layer combines the previous layer\'s features into something more abstract.',pts:[

['Low-level features','Early layers find simple patterns such as edges, corners and textures.'],
['Mid-level features','Middle layers combine those into shapes and parts such as an eye or a wheel.'],

{q:'Compare the input, hidden and output layers of a neural network. Explain the operation of a feedforward neural network.',key:'Input receives the data, hidden layers learn features, output gives the prediction. In a feedforward network, data flows one way only.',extra:T(['Layer','Role','Note'],[['Input','Receives raw data','One node per feature, no learning of its own'],['Hidden','Learns intermediate features','More of them means a deeper network'],['Output','Produces the prediction','Softmax for multi-class, sigmoid for binary, linear for regression']]),pts:[

{q:'Explain the neural-network training cycle, including forward propagation, loss calculation, backpropagation, gradient computation and parameter updates.',key:'Predict, measure the error, trace it back, adjust the weights, repeat.',fig:D.train,pts:[

['2. Loss calculation','A loss function such as cross-entropy or MSE compares ŷ with the true value y.'],
['3. Backpropagation','The error is sent backward through the network using the chain rule.'],
['4. Gradient computation','This gives ∂L/∂w for every weight: how much the loss changes if that weight changes.'],
['5. Parameter update',FX('w ← w − η ∂L/∂w')+'Move against the gradient, with η setting the step size.'],
['6. Repeat','Run over many batches and epochs until the loss stops improving, monitoring validation data.']]},
{q:'Describe the structure and operation of a CNN. Explain local receptive fields, parameter sharing, filters, stride, padding, ReLU, pooling and fully connected layers.',key:'A CNN extracts spatial features with convolution and pooling, then classifies them with fully connected layers.',fig:D.cnn,pts:[
['Local receptive field','Each neuron looks at a small region, not the whole image.'],
['Filter','A small matrix of learned weights that detects a pattern such as an edge.'],
['Parameter sharing','One filter slides over the whole image, so it detects the pattern anywhere and uses far fewer parameters.'],
['Stride','How many pixels the filter moves each step. A larger stride gives a smaller output.'],
['Padding','Adding border pixels. Valid = none (output shrinks). Same = keeps height and width at stride 1.'],
['ReLU','Applied after convolution to add non-linearity: max(0, x).'],
['Pooling','Downsamples each region, for example by keeping the max. Reduces size and gives some tolerance to shifts.'],
['Fully connected layers','After flattening, they combine the features to make the final prediction, usually with softmax.']]},
{q:'Define an RNN and explain how its hidden state acts as memory. Discuss shared weights, vanishing gradients and exploding gradients.',key:'An RNN processes a sequence one step at a time and passes a hidden state forward as memory.',fig:D.rnn,pts:[
['Hidden state as memory',FX('hₜ = tanh(Wxₜ + Uhₜ₋₁ + b)')+'The new state mixes the current input with the previous state, so past information carries forward.'],
['Output',FX('yₜ = Vhₜ + c')],
['Shared weights','The same W, U and V are used at every time step, so it handles any sequence length with fewer parameters.'],
['Vanishing gradients','In BPTT, gradients are multiplied across many steps. If the factors are below 1, they shrink toward zero and early steps stop learning, so long-range memory is lost.'],
['Exploding gradients','If the factors are above 1, gradients grow huge and training becomes unstable. Gradient clipping is the usual fix.']]},
{q:'Compare LSTM, GRU and bidirectional RNN architectures. Explain the role of gates and the benefit of processing a sequence in both directions.',key:'Gates control what is remembered and forgotten, which eases the vanishing-gradient problem. Bidirectional models also use future context.',fig:D.lstm,extra:T(['Model','Gates','Memory','Strength'],[['LSTM','Input, forget, output','Separate cell state + hidden state','Best for long dependencies, but heavier'],['GRU','Update, reset','Hidden state only','Simpler and faster, often similar accuracy'],['Bidirectional RNN','Depends on the cell used','Forward + backward states','Uses both past and future context']]),pts:[
['Role of gates','Gates are learned values between 0 and 1 that decide how much information passes: erase, store or output.'],
['Why both directions help','In "The bank of the river", the word "river" comes after "bank" but tells you its meaning. A backward pass captures that. It needs the whole sequence available, so it does not suit live prediction.']]},
{q:'Explain GAN architecture and its training process. Describe the roles of the generator and discriminator and give applications mentioned in the lecture.',key:'Two networks compete: a generator creates fakes and a discriminator tries to catch them.',fig:D.gan,pts:[
['Generator','Takes random noise and produces fake samples. Its goal is to fool the discriminator.'],
['Discriminator','Receives real and fake samples and outputs how likely each one is to be real.'],
['Training step 1','Freeze G. Train D to label real data as real and fakes as fake.'],
['Training step 2','Freeze D. Train G so that D labels its fakes as real.'],
['Result','They improve together until the fakes become very hard to tell from real data.'],
['Applications '+CHK,'Realistic image generation, image-to-image translation, super-resolution, style transfer and data augmentation.']]},
{q:'Explain the Transformer architecture and self-attention. Then discuss the main stages of preparing, designing, optimizing and evaluating a deep-learning model, including ethical concerns.',key:'Transformers use attention, not recurrence, to relate every token to every other token.',fig:Fig('p03_0','The encoder–decoder transformer (from your lecture)'),pts:[
['Architecture','Embeddings plus positions go into an encoder (self-attention + feed-forward). A decoder adds masked self-attention and cross-attention, then a linear layer and softmax give the output.'],
['Self-attention',FX(`softmax(${Fr('QKᵀ','√dₖ')}) V`)+'Q, K and V all come from the same sequence. Each token gets a context-aware representation.'],
['Prepare','Collect and clean data, normalize it, split into train, validation and test sets, augment if useful.'],
['Design','Choose an architecture that fits the data (CNN, RNN, Transformer), plus depth, activations and loss.'],
['Optimize','Choose optimizer and learning rate, train in mini-batches, use regularization such as dropout, tune hyperparameters.'],
['Evaluate','Measure on unseen test data with accuracy, precision, recall or similar, and check for overfitting.'],
['Ethics','Bias and fairness in training data, privacy, lack of explainability, misuse such as deepfakes, and energy cost.']]},
],
});

mcq:[

['In the gradient-descent update rule, η represents the:',['Batch size','Learning rate','Number of epochs','Loss value'],1,'η (eta) is the step size, the learning rate.'],

['An adaptive learning-rate method can change the learning rate based on:',['The size or behavior of gradients and training progress','The color of the input data','The number of output labels only','The file format'],0,'It adapts to how large the gradient is and how fast learning is going.'],

['In batch gradient descent, the gradient is calculated using:',['One randomly selected example only','The full training dataset','No training examples','Only the validation set'],1,'"Batch" here means the whole training set. Option A is SGD.'],
['Stochastic gradient descent updates parameters using:',['A single selected training example at a time','The complete dataset for every update','Only test examples','A fixed random weight'],0,'Stochastic means random: one randomly picked example per update.'],
['Mini-batch gradient descent uses:',['A small batch of training examples for each update','Only one example for the entire training process','The entire test set','No gradient calculation'],0,'The middle ground between batch and SGD, and the usual choice in practice.'],
['One advantage of mini-batch training mentioned in the lecture is:',['It can parallelize computation and increase speed on GPUs','It guarantees zero training error','It eliminates all hyperparameters','It prevents every form of overfitting'],0,'Batches run in parallel on GPUs. Watch out for words like "guarantees" and "every": they are usually wrong.'],
['The lecture notes that mini-batches can provide:',['A more accurate gradient estimate and smoother convergence than single-example SGD','No gradient estimate','A guaranteed global minimum','A larger model by definition'],0,'Averaging across several examples reduces the noise of single-example SGD.'],
['Underfitting occurs when a model:',['Is too simple or lacks capacity to learn the data adequately','Memorizes the training data','Has excellent performance on all unseen data','Uses too many training examples'],0,'Too simple, so it does poorly even on the training data. Memorising is overfitting.'],

essay:[
{q:'Explain why optimizing a neural network\'s loss function can be difficult. Describe the role of gradient descent in addressing this problem.',key:'The loss surface is huge and non-convex, so we cannot solve it directly. Gradient descent walks downhill step by step.',pts:[
['Why it is hard: many dimensions','Millions of weights mean a surface in millions of dimensions. It cannot be visualised or solved by formula.'],
['Why it is hard: non-convex','The surface has many local minima, flat areas and saddle points, so a low point may not be the lowest.'],
['Why it is hard: tuning','The result depends on the starting weights and on the learning rate.'],
['Role of gradient descent','It computes the local slope of the loss, then takes a small step downhill. Repeating this gradually lowers the loss, without needing to see the whole surface.']]},
{q:'Write and explain the gradient-descent weight-update equation. Define the learning rate, loss function and gradient.',key:'W ← W − η ∂J/∂W',pts:[
['W','The current weights of the network.'],
['Loss function J','A number measuring how wrong the predictions are. The goal is to minimise it.'],
['Gradient ∂J/∂W','The slope of the loss with respect to each weight. It points in the direction of steepest increase.'],
['Learning rate η','A hyperparameter that sets the step size.'],
['Why the minus sign','The gradient points uphill, so subtracting it moves the weights downhill, which lowers the loss.']]},
{q:'Discuss the effects of choosing a learning rate that is too small, too large, or suitably selected. Refer to the learning-rate illustrations on pages 5–8.',key:'Too small is slow, too large is unstable, a good value converges smoothly.',fig:D.lr,pts:[
['Too small','Very slow convergence, and the model can get stuck in a false local minimum.'],
['Too large','Overshoots the minimum, becomes unstable, and the loss can diverge.'],
['Suitably selected','Converges smoothly and steps over poor local minima.'],
['In practice','Try several values while watching the loss, or use an adaptive method such as Adam.']],tip:'This sheet refers to pages 5–8 of a lecture I don\'t have. The diagram is my own drawing of the standard picture, so compare it with your slides.'},
{q:'Explain the idea of an adaptive learning rate. Why might a fixed learning rate be unsuitable throughout all stages of training?',key:'An adaptive method changes the step size during training instead of keeping one value.',pts:[
['The idea','The rate is no longer fixed. It can change with how large the gradient is, how fast learning is going, and the size of particular weights.'],
['Why fixed fails: early training','You are far from the minimum, so large steps are useful.'],
['Why fixed fails: late training','You are close to the minimum, so large steps overshoot and small steps are needed.'],
['Why fixed fails: different weights','Some parameters need larger updates than others, and one value cannot suit all of them.'],
['Examples','Adam, Adadelta, Adagrad and RMSProp.']]},
{q:'Compare batch gradient descent, stochastic gradient descent and mini-batch gradient descent in terms of the amount of data used for each update, computational behavior and gradient estimate.',key:'They differ in how many examples are used per update. Mini-batch is the practical compromise.',extra:T(['','Batch','Stochastic (SGD)','Mini-batch'],[['Data per update','All N examples','1 example','B examples, e.g. 32'],['Computation','Very expensive per update','Very cheap per update','Moderate, runs in parallel on GPUs'],['Gradient estimate','Exact, stable','Noisy','Good estimate, fairly smooth'],['Convergence path','Smooth but slow','Zig-zag','Smoother than SGD, faster than batch']]),pts:[
['Bottom line','Mini-batch gives a more accurate gradient than SGD, smoother convergence, the option of larger learning rates, and fast GPU training.']]},
{q:'Describe the basic gradient-descent algorithm from initialization to returning the learned weights. Explain why gradients are computed before weights are updated.',key:'Initialise, loop (compute gradient, update), return.',pts:[
['1. Initialise','Set the weights randomly, typically W ~ N(0, σ²).'],
['2. Loop until convergence','Repeat until the loss stops improving.'],
['3. Compute the gradient','∂J/∂W, using a forward pass and then backpropagation.'],
['4. Update',FX('W ← W − η ∂J/∂W')],
['5. Return','Return the final learned weights.'],
['Why gradient first','The update formula needs the gradient as an input. It is what tells us which direction to move and how far. It is measured at the current weights, so it has to be computed before they change.']]},
{q:'Define underfitting, ideal fit and overfitting. Explain how model capacity affects these three situations.',key:'Capacity is how complex a pattern the model can represent. Too little underfits, too much overfits.',fig:D.fit,pts:[
['Underfitting','The capacity is too low, so the model misses the real pattern. High error on training and on unseen data.'],
['Ideal fit','The capacity matches the data. It learns the pattern and generalises. Low error on both.'],
['Overfitting','The capacity is too high, so the model memorises noise. Very low training error, but high unseen-data error.'],
['Effect of capacity','As capacity grows, training error keeps falling, while validation error first falls and then rises. The best model sits at the validation minimum.']]},
{q:'What is regularization, and why is it used? Explain how dropout works during training and how it discourages reliance on particular neurons.',key:'Regularization constrains optimization to discourage complex models, improving generalization.',pts:[
['Why it is used','To stop overfitting so the model does well on unseen data.'],
['How dropout works','At each training iteration, randomly set a fraction of activations to 0, typically 50%. A different set is dropped each time.'],
['In testing','Dropout is turned off and all neurons are used.'],
['Why it reduces reliance','Any neuron might disappear at any step, so the network cannot depend on one specific neuron. It has to spread knowledge across many pathways, which gives more robust features.']]},
{q:'Explain early stopping and describe how training loss and validation/testing loss can be used to decide when to stop training.',key:'Stop at the point where validation loss is lowest.',fig:D.early,pts:[
['Set aside data','Hold out validation data that is never used for updating weights.'],
['Track both curves','Record training loss and validation loss at each epoch.'],
['Early phase','Both fall, because the model is still learning.'],
['Later phase','Training loss keeps falling, but validation loss starts to rise. The model has started to overfit.'],
['The decision','Stop at the validation minimum, and keep the weights from that point.']]},
{q:'Discuss how learning-rate selection, mini-batch training and regularization can work together to improve neural-network training and generalization.',key:'The first two help the model train well. The third helps it generalise.',pts:[
['Learning rate','Controls the step size. A good or adaptive rate gives stable, efficient convergence.'],
['Mini-batches','Give good gradient estimates at low cost, with GPU speed. Their mild noise can also help escape poor spots.'],
['Regularization','Dropout and early stopping keep the model from memorising the training set.'],
['How they connect','Mini-batches allow larger learning rates. Early stopping watches the validation loss during that training. Dropout makes the loss noisier, so a suitable learning rate keeps it stable.'],
['Together','Training is fast and stable, and the final model also does well on unseen data.']]},
],

essay:[
{q:'Define a Convolutional Neural Network and explain why CNNs are particularly suitable for visual perception tasks.',key:'A CNN is a deep network that uses convolutional layers to learn spatial features automatically from grid data such as images.',pts:[
['They use local patterns','Nearby pixels are related, and small filters capture exactly that.'],
['Parameter sharing','The same filter is used across the whole image, so far fewer parameters are needed than in a fully connected network.'],
['Position tolerance','A pattern is found wherever it appears, and pooling makes small shifts matter less.'],
['Hierarchy of features','Edges build textures, textures build parts, and parts build objects.'],
['No hand-made features','The filters are learned during training.']]},
{q:'Draw and explain the typical CNN architecture. Describe the roles of convolutional, activation, pooling, fully connected and Softmax layers.',key:'Image → (Conv → ReLU → Pool) repeated → Flatten → Fully connected → Softmax.',fig:D.cnn,pts:[
['Convolutional','Slides filters over the input to produce feature maps of local patterns.'],
['Activation (ReLU)','Adds non-linearity, so the model can learn complex patterns.'],
['Pooling','Downsamples the maps, reducing computation and making features tolerant to small shifts.'],
['Fully connected','After flattening, combines all the features to reason about the whole image.'],
['Softmax','Turns the final scores into probabilities that sum to 1, one per class.']]},
{q:'Explain the functions of TensorFlow, Keras, NumPy and Matplotlib in the CNN development workflow.',key:'TensorFlow does the computation, Keras defines the model, NumPy holds the data, Matplotlib shows it.',extra:T(['Tool','Job','Example'],[['TensorFlow','Deep-learning framework: tensors, gradients, GPU training','Runs training'],['Keras','High-level API on top of TensorFlow','Sequential, Conv2D, Dense, fit'],['NumPy','Numerical arrays and maths','Stores images, x_train / 255'],['Matplotlib','Plotting and visualization','Sample images, accuracy curves']]),pts:[]},
{q:'Describe the CIFAR-10 dataset and explain the roles of x_train, y_train, x_test and y_test. Why are pixel values divided by 255?',key:'60,000 colour images of size 32×32 in 10 classes, 6,000 per class.',pts:[
['x_train','Training images, which the model learns from.'],
['y_train','Training labels, integers from 0 to 9.'],
['x_test','Test images, kept away from training.'],
['y_test','True labels of the test images, used to score predictions.'],
['Why divide by 255','Pixels run from 0 to 255. Dividing maps them to 0–1. Smaller, consistent values give more stable gradients and faster training.']]},
{q:'Explain the example CNN architecture in the lecture, including the sequence and purpose of Conv2D, MaxPooling2D, Flatten and Dense layers.',key:'Two Conv and Pool blocks extract features, then Flatten and Dense layers classify them.',fig:D.cnn,extra:T(['Layer','Output shape','Purpose'],[['Conv2D(32, 3×3, ReLU)','30×30×32','Simple features such as edges'],['MaxPooling2D(2×2)','15×15×32','Reduces size'],['Conv2D(64, 3×3, ReLU)','13×13×64','More complex features'],['MaxPooling2D(2×2)','6×6×64','Reduces size again'],['Flatten','2,304','Makes a vector'],['Dense(64, ReLU)','64','Combines features'],['Dense(10)','10','One score per class']]),pts:[],tip:'I don\'t have Lecture 8, so I rebuilt this from your sheet: MCQ 7 gives the first layer, and Problems 7–9 give 30×30×32, 6×6×64 and Dense 64. Many Keras versions add a third Conv2D, giving 4×4×64. Check your slides.'},
{q:'Explain the three components used when compiling the example CNN: Adam optimizer, SparseCategoricalCrossentropy loss and accuracy metric.',key:'Optimizer = how to learn. Loss = what to minimise. Metric = what we report.',pts:[
['Adam optimizer','Updates the weights using gradients, with an adaptive learning rate for each parameter. It usually works well with little tuning.'],
['SparseCategoricalCrossentropy','The loss for multi-class problems where labels are integers. It penalises low probability on the true class.'],
['Accuracy metric','The share of correct predictions. It is reported for us to read and is not used to compute gradients.']]},
{q:'Describe the model training, validation, evaluation and prediction stages. Explain the meaning of epoch, batch size, test loss and test accuracy.',key:'Train on training data, watch validation data, evaluate on test data, predict on new data.',pts:[
['Training','model.fit: repeated forward passes, loss, backprop and weight updates.'],
['Validation','After each epoch, measure unseen data to spot overfitting.'],
['Evaluation','model.evaluate: one final score on the test set.'],
['Prediction','model.predict: gives class probabilities or scores; argmax picks the class.'],
['Epoch','One complete pass through the training data.'],
['Batch size','Number of samples processed before each weight update.'],
['Test loss','Average loss on the test set. Lower is better.'],
['Test accuracy','Correct / total on the test set: the estimate of real-world performance.']]},
{q:'Discuss the advantages of CNNs and explain at least three applications, such as image classification, object detection, image segmentation and facial recognition.',key:'CNNs learn features automatically, use fewer parameters, and work across many vision tasks.',pts:[
['Advantages','Automatic feature learning, parameter sharing, spatial tolerance and high accuracy on visual data.'],
['Image classification','One label for a whole image, for example "cat".'],
['Object detection','Finds each object, outputting bounding boxes and class probabilities. Used in self-driving cars.'],
['Image segmentation','Labels every pixel. Used to outline tumours in medical scans.'],
['Facial recognition','Learns a face representation and compares it, for example to unlock a phone.']]},
{q:'Explain transfer learning and data augmentation. Describe how each can improve CNN development when data or computational resources are limited.',key:'Transfer learning reuses a trained model. Augmentation creates more training variety.',pts:[
['Transfer learning','Take a model pre-trained on a large dataset such as ImageNet. Freeze its early layers, replace the final layers, and train those on your data.'],
['Why it helps','General features such as edges carry over, so you need less data and much less training time.'],
['Data augmentation','Create altered copies of training images by flipping, rotating, zooming or cropping.'],
['Why it helps','More variety without collecting new data, which reduces overfitting. The label stays the same.']]},
{q:'Discuss methods for handling overfitting and optimizing CNN performance. Include dropout, L1/L2 regularization, early stopping, batch normalization, learning-rate scheduling, pruning and quantization. Mention one ethical consideration.',key:'Some methods improve generalization, some improve training, and some shrink the model.',extra:T(['Method','What it does','Goal'],[['Dropout','Randomly drops neurons in training','Reduce overfitting'],['L1 / L2','Adds a weight-size penalty to the loss; L1 can produce zero weights, L2 keeps them small','Reduce overfitting'],['Early stopping','Stops when validation loss starts rising','Reduce overfitting'],['Batch normalization','Normalizes layer inputs','Faster, more stable training'],['LR scheduling','Lowers the learning rate over time','Better convergence'],['Pruning','Removes unimportant weights','Smaller, faster model'],['Quantization','Stores weights at lower precision','Smaller, faster model']]),pts:[
['Ethical consideration','Bias in training data: a facial-recognition model trained mainly on one group can perform worse on others, which leads to unfair outcomes.']]},
],

cheat:[
{h:'Attention (most important)',rows:[
['Formula',FX(`Attention(Q, K, V) = softmax(${Fr('QKᵀ','√dₖ')}) V`)],
['Four stages',`1. Compute QKᵀ. 2. Divide by √dₖ. 3. Softmax each row. 4. Multiply by V.`],
['Softmax',FX(`softmax(sᵢ) = ${Fr('e<sup>sᵢ</sup>','Σⱼ e<sup>sⱼ</sup>')}`),'Each row becomes non-negative weights that sum to 1.'],
['Why scale by √dₖ',`Stops dot products from growing too large as the key dimension grows.`],
['Projections',FX('Q = XW<sub>Q</sub> &nbsp; K = XW<sub>K</sub> &nbsp; V = XW<sub>V</sub>')],
['Query',`What a token is looking for.`],
['Key',`Features used to decide whether a token is relevant.`],
['Value',`The information that gets combined.`],
]},
{h:'Attention types',rows:[
['Self-attention',`Q, K, V all come from the same sequence.`],
['Causal (masked)',`Target sequence, future positions blocked. Masked scores are −∞ before softmax, so their weight is 0.`],
['Cross-attention',`Q from the decoder. K and V from the encoder.`],
['Score count',FX('n² per head'),'Doubling n gives 4× the scores.'],
]},
{h:'Multi-head',rows:[
['Head size',FX(`d<sub>head</sub> = ${Fr('d<sub>model</sub>','h')}`)],
['Each head',FX('headᵢ = Attention(QWᵢ<sup>Q</sup>, KWᵢ<sup>K</sup>, VWᵢ<sup>V</sup>)')],
['Combine',FX('MultiHead = Concat(head₁, …, headₕ) W<sup>O</sup>')],
]},
{h:'Input side',rows:[
['Token',`A word, subword, punctuation mark or symbol.`],
['Pipeline',`Text → tokens → integer IDs → dense vectors.`],
['Embedding shape',FX('X ∈ ℝ<sup>n × d_model</sup>')],
['Even dimensions',FX('PE(pos, 2i) = sin(pos / 10000<sup>2i/d_model</sup>)'),'Even = sine.'],
['Odd dimensions',FX('PE(pos, 2i+1) = cos(pos / 10000<sup>2i/d_model</sup>)'),'Odd = cosine.'],
['Combine',FX('Z = E + P'),'Added, element by element. Not concatenated.'],
]},
{h:'Layer parts',rows:[
['FFN',FX('FFN(x) = ReLU(xW₁ + b₁)W₂ + b₂'),'Two linear layers, ReLU between. Same parameters at every position.'],
['Residual',FX('y = x + F(x)')],
['Layer norm',FX(`LayerNorm(x) = γ · ${Fr('x − μ','√(σ² + ε)')} + β`),'γ, β learned. ε keeps it stable. Use population variance (divide by n).'],
['Encoder layer',`Multi-head self-attention → Add & Norm → FFN → Add & Norm.`],
['Decoder layer',`Masked self-attention → Add & Norm → Cross-attention → Add & Norm → FFN → Add & Norm.`],
['Decoder output',`Linear projection to vocabulary-sized logits → softmax.`],
]},
{h:'Training',rows:[
['Loss',FX('L = −ln(p)'),'p = probability of the correct token. Higher p gives lower loss.'],
['Update',FX('W<sub>new</sub> = W<sub>old</sub> − η ∂L/∂W')],
['Optimizers',`Adam and AdamW. AdamW decouples weight decay from the gradient-moment update.`],
['Workflow',`Data → Tokenize → Forward → Loss → Backprop → Update → Repeat and monitor validation.`],
['Shifted right',`The decoder receives correct previous tokens and learns to predict the next one.`],
]},
{h:'Model families',rows:[

['Decoder-only',`Causal self-attention. Text and code generation. GPT, Llama, Mistral.`],
['Encoder–decoder',`Encoder self-attention + decoder causal and cross-attention. Translation, summarization. T5, original transformer.`],
['Origin',`Vaswani et al., 2017, "Attention Is All You Need".`],
['ViT',`Image → patches → vectors → transformer layers.`],
]},
],

['The central operation of a standard transformer is:',['Recurrence','Pooling','Attention','Sorting'],2,'Each token combines information from others using learned relevance weights.'],
['A token may be:',['Only a complete word','A word, subword, punctuation mark, or symbol','Only a sentence','Only a number'],1,'For example, "learning" can split into "learn" and "ing".'],
['An embedding layer maps a token ID to:',['A dense learned vector','A class label only','A probability distribution only','A positional mask'],0,'An integer ID goes in and a dense vector, learned during training, comes out.'],

['The Query represents:',['What a token is looking for','The final class label','Sequence length','The optimizer'],0,'Query seeks, Key is matched against it, Value is what gets combined.'],
['Value vectors contain:',['Position indices','Information to be combined','Vocabulary IDs','Learning rates'],1,'The attention weights decide how much of each Value to combine.'],
['Softmax converts a score row into weights that:',['Are all negative','Sum to one','Are always equal','Must be integers'],1,'Non-negative weights that sum to 1.'],

['A causal mask prevents a token from attending to:',['Earlier positions','Itself','Future positions','Every position'],2,'A token cannot peek ahead. Earlier positions and itself remain allowed.'],
['In original encoder–decoder cross-attention, Keys and Values come from:',['Encoder outputs','Vocabulary list','Loss function','Optimizer'],0,'Decoder asks (Q). Encoder answers (K, V).'],

['A basic gradient-descent update is:',['W_new=W_old+η∂L/∂W','W_new=W_old−η∂L/∂W','W_new=η/W_old','W_new=W_old×η'],1,'Subtract, to move downhill.'],

['Compute xW₁','1st: 1×1 + 2×0 = 1<br>2nd: 1×0 + 2×1 = 2<br>3rd: 1×1 + 2×1 = 3<br>xW₁ = [1, 2, 3]','x is a row, so multiply it with each column of W₁.'],
['Add b₁','[1, 2, 3] + [0, 0, 0] = [1, 2, 3]',''],
['Apply ReLU','[1, 2, 3] stays [1, 2, 3]','All values are positive, so nothing changes.'],
['Multiply by W₂','1st: 1×1 + 2×0 + 3×1 = 4<br>2nd: 1×0 + 2×1 + 3×1 = 5','Size goes 2 → 3 → 2.'],
['Add b₂','[4, 5] + [0, 0] = [4, 5]','']],ans:'FFN(x) = [4, 5]'},
{t:'Residual connection',q:`x = [2,3,4] and F(x) = [1,2,1]. Find y.`,use:FX('y = x + F(x)'),steps:[['Add element by element','2 + 1 = 3<br>3 + 2 = 5<br>4 + 1 = 5','The input travels around the sublayer, which gives gradients a direct path.']],ans:'y = [3, 5, 5]'},
{t:'Layer normalization',q:`x = [2,4,6]. Find the mean, population variance and normalized vector, with γ = 1, β = 0, ε ≈ 0.`,use:FX(`LayerNorm(x) = γ · ${Fr('x − μ','√(σ² + ε)')} + β`),steps:[
['Mean','μ = (2 + 4 + 6) / 3 = 4',''],
['Population variance','σ² = [(2−4)² + (4−4)² + (6−4)²] / 3<br>= (4 + 0 + 4) / 3 = 8/3 ≈ 2.6667','Population means divide by n = 3, not n − 1.'],
['Square root','√(8/3) ≈ 1.6330','ε ≈ 0, so it disappears.'],
['Normalize each value','(2 − 4) / 1.6330 ≈ −1.2247<br>(4 − 4) / 1.6330 = 0<br>(6 − 4) / 1.6330 ≈ 1.2247','With γ = 1, β = 0, nothing else changes.']],ans:'μ = 4, σ² = 8/3, [−1.225, 0, 1.225]'},
{t:'Cross-entropy loss',q:`The model gives p = 0.80 to the correct token. Find L = −ln(p).`,use:FX('L = −ln(p)'),steps:[
['Take the natural log','ln(0.80) ≈ −0.2231','Use the ln key, not log.'],
['Flip the sign','L = −(−0.2231) = 0.2231','Compare p = 0.60 gives L = 0.5108: lower confidence, higher loss.']],ans:'L ≈ 0.2231'},

['Find the step','0.10 × 0.20 = 0.02',''],['Subtract','0.50 − 0.02 = 0.48','']],ans:'W_new = 0.48'},

essay:[
{q:'Define transformer technology and explain why it was introduced. Compare transformers with RNNs and LSTMs in sequence processing, parallelization, and long-range relationships.',key:'A transformer is a neural architecture built around attention, introduced in "Attention Is All You Need" (Vaswani et al., 2017).',extra:T(['Feature','RNN / LSTM','Transformer'],[['Sequence processing','One step at a time, recurrent state','Attention across all positions'],['Parallelization','Limited by sequential dependency','Can be parallelized during training'],['Long-range relationships','Passed through many steps, can fade','Direct attention paths'],['Position','Comes from processing order','Must be added explicitly'],['Applications','Time series, speech','Language, vision, audio, multimodal']]),pts:[
['Why it was introduced','RNNs create sequential dependencies that limit parallel computation, and long-range information is hard to preserve. Attention fixes both with direct links between positions.']]},
{q:'Explain tokenization and word embeddings. Describe how text is converted into token IDs and dense vector representations, giving an example.',key:'Text → tokens → integer IDs → dense vectors.',fig:Fig('p03_1','Tokenization and embedding pipeline (from your lecture)'),pts:[
['Tokenization','Splits text into tokens: a word, subword, punctuation mark or special symbol. Subwords let uncommon words be built from familiar pieces.'],
['Token IDs','Each token is mapped to an integer in a vocabulary.'],
['Embeddings','An embedding layer maps each ID to a dense learned vector. n tokens give a matrix of shape n × d_model.'],
['Example','"Deep learning works." → [Deep, learn, ing, works, .] → five IDs → five vectors, for example [0.2, 0.1, 0.4, 0.3] each with 4 dimensions. The exact split depends on the tokenizer.']]},
{q:'Why does a transformer require positional information? Explain sinusoidal positional encoding, write its equations, and describe how it is added to embeddings.',key:'Self-attention has no built-in sense of order, so position must be added.',pts:[
['Why','"The cat chased the mouse" and "The mouse chased the cat" have the same words but different meanings.'],
['The method','The original transformer gives each position a vector of sine and cosine values at different frequencies.'],
['Equations',FX('PE(pos, 2i) = sin(pos / 10000<sup>2i/d_model</sup>)')+FX('PE(pos, 2i+1) = cos(pos / 10000<sup>2i/d_model</sup>)')+'pos = token position, i = dimension-pair index, d_model = embedding size.'],
['How it is added',FX('Z = E + P')+'Element by element, so the size stays the same.'],
['Example','At pos = 1, d_model = 4: P ≈ [0.8415, 0.5403, 0.0100, 0.99995]. Added to [0.2, 0.3, 0.4, 0.5], this gives [1.0415, 0.8403, 0.4100, 1.49995].']]},
{q:'Explain the roles of Query, Key, and Value. Describe the four stages of scaled dot-product attention and explain the purpose of scaling and softmax.',key:'Attention(Q, K, V) = softmax(QKᵀ / √dₖ) V',fig:Fig('p06_0','The four stages (from your lecture)'),pts:[
['Query','What a token is looking for.'],
['Key','Features used to decide whether a token is relevant.'],
['Value','The information that is combined using the weights.'],
['Stage 1: QKᵀ','Dot products measure how well each query matches each key.'],
['Stage 2: divide by √dₖ','Purpose of scaling: stops the scores from growing too large as the key dimension increases.'],
['Stage 3: softmax each row','Purpose of softmax: turns each row into non-negative weights that sum to one.'],
['Stage 4: multiply by V','Each output is a weighted combination of the Value vectors.']]},
{q:'Differentiate among self-attention, causal (masked) self-attention, and cross-attention. Give an example use of each.',key:'They differ in where Q, K and V come from and in what is blocked.',extra:T(['Type','Query from','Key, Value from','Example use'],[['Self-attention','Same sequence','Same sequence','Encoder understanding "it" in a sentence'],['Causal self-attention','Target sequence','Target, future masked','Decoder or GPT generating the next word'],['Cross-attention','Decoder','Encoder','Translation: focusing on the source words']]),fig:Fig('p08_0','Causal mask: future positions blocked (from your lecture)'),pts:[
['How masking works','Scores for future positions are set to −∞ before softmax, so their attention weight becomes 0.']]},
{q:'Explain multi-head attention. How are head outputs combined, and why can multiple heads help a model learn different relationships?',key:'Several attention operations run in parallel, each with its own learned projections.',fig:Fig('p09_0','Multi-head attention (from your lecture)'),pts:[
['Each head',FX('headᵢ = Attention(QWᵢ<sup>Q</sup>, KWᵢ<sup>K</sup>, VWᵢ<sup>V</sup>)')],
['Size',FX(`d<sub>head</sub> = ${Fr('d<sub>model</sub>','h')}`)+'For example, 8 / 4 = 2.'],
['Combining',FX('MultiHead = Concat(head₁, …, headₕ) W<sup>O</sup>')+'Outputs are concatenated, then transformed by a learned matrix Wᴼ. [1,2], [3,4], [5,6], [7,8] gives [1,2,…,8].'],
['Why it helps','Each head has its own projections, so heads can learn different patterns. Their exact roles are learned, not assigned by hand.']]},
{q:'Describe a transformer encoder layer and explain multi-head self-attention, the feed-forward network, residual connections, and layer normalization.',key:'Multi-head self-attention, then a feed-forward network, each wrapped in a residual connection and layer normalization.',fig:Fig('p10_0','Encoder layer (from your lecture)'),pts:[
['Multi-head self-attention','Each token gathers context from the sequence, across several heads.'],
['Feed-forward network',FX('FFN(x) = ReLU(xW₁ + b₁)W₂ + b₂')+'Transforms each token independently, with the same parameters at every position.'],
['Residual connection',FX('y = x + F(x)')+'Gives information and gradients a direct path, which helps optimise deep networks.'],
['Layer normalization',FX(`γ · ${Fr('x − μ','√(σ² + ε)')} + β`)+'Normalizes features within a token representation, stabilising their scale.'],
['Flow','Embeddings + position → attention → Add & Norm → FFN → Add & Norm → next layer.']]},
{q:'Describe the original transformer decoder. Explain masked self-attention, encoder–decoder cross-attention, the feed-forward network, and output projection with softmax.',key:'The decoder generates the output: masked self-attention, cross-attention and an FFN, each with Add & Norm.',fig:Fig('p12_0','Decoder layer (from your lecture)'),pts:[
['Masked self-attention','The prediction at position t may depend only on positions up to t. All positions can still be computed in parallel in training, without leaking future tokens.'],
['Cross-attention','Decoder states produce Queries, and encoder outputs produce Keys and Values, so each position can focus on relevant parts of the input.'],
['Feed-forward network','Two linear layers with ReLU, applied to each position separately.'],
['Output projection','The final representation is projected to vocabulary-sized logits.'],
['Softmax','Turns logits into next-token probabilities. A decoding strategy selects or samples the next token.']]},
{q:'Explain the transformer training workflow. Discuss forward propagation, cross-entropy loss, backpropagation, learning rate, and optimizers such as Adam and AdamW.',key:'Forward pass → loss → backprop → optimizer update, repeated across batches.',fig:Fig('p13_0','Training workflow (from your lecture)'),pts:[
['Forward propagation','Tokenized inputs pass through the model to produce predictions.'],
['Cross-entropy loss',FX('L = −ln(p)')+'p is the probability of the correct token. p = 0.60 gives 0.5108, and p = 0.90 gives 0.1054: higher p, lower loss.'],
['Backpropagation','Uses the chain rule to compute the gradient of the loss for every trainable parameter.'],
['Learning rate',FX('W<sub>new</sub> = W<sub>old</sub> − η ∂L/∂W')+'η sets the step size.'],
['Adam and AdamW','Common adaptive optimizers. AdamW decouples weight decay from the gradient-moment update.'],
['Next-token training','In encoder–decoder training, the decoder receives the correct previous tokens shifted right and predicts the next one. Validation performance is monitored throughout.']]},
{q:'Compare encoder-only, decoder-only, and encoder–decoder models in attention pattern, typical tasks, and examples. Then discuss at least three application areas.',key:'Encoder-only understands, decoder-only generates, encoder–decoder transforms one sequence into another.',extra:T(['Family','Attention pattern','Tasks','Examples'],[['Encoder-only','Bidirectional self-attention','Classification, sentiment, NER, retrieval','BERT, RoBERTa, DistilBERT'],['Decoder-only','Causal self-attention','Text and code generation','GPT, Llama, Mistral'],['Encoder–decoder','Encoder self + decoder causal and cross','Translation, summarization','T5, original transformer']]),pts:[
['Natural language processing','Text classification, sentiment analysis, question answering, summarization, language generation.'],
['Machine translation','The encoder reads the source sentence, and cross-attention lets the decoder focus on relevant source words.'],
['Computer vision','Vision Transformer (ViT) divides an image into patches, turns them into vectors, and processes them with transformer layers.'],
['Other areas','Speech and audio, code generation (test and review the output), and multimodal AI.']]},
],
});

body:`<p><b>Trap:</b> mixing up backpropagation and the update. Backprop only computes gradients. The optimizer changes the weights.</p><p><b>Rule:</b> always write the same five steps in order.</p>${FX('Forward → Loss → Backprop → Update → Repeat')}`,

{badge:'In 4 of 4 sheets',t:'2 · Words that give away a wrong MCQ option',spot:'Options containing only, always, guarantees, every, no, all.',
body:`<p><b>Trap:</b> these options sound confident but are nearly always wrong: "guarantees zero training error", "Softmax only", "Only a complete word".</p><p><b>Rule:</b> cross these out first. One real exception: "Moves <i>only</i> forward from input to output" is correct, because "only forward" is the definition of feedforward.</p><p><b>If you must guess:</b> the longest, most specific option was correct in 51 of the 80 MCQs on these sheets. Use that only as a last resort, since your real exam may be written differently.</p>`,
ex:[['opt','mcq',11],['cnn','mcq',3],['trans','mcq',2],['intro','mcq',8]]},
{badge:'In 3 of 4 sheets',t:'3 · Gradient-descent update',spot:'A weight, a gradient and η. Or "which formula is correct?"',
body:`<p><b>Trap:</b> the sign when the gradient is negative, and using the old weight in a second update.</p><p><b>Rule:</b></p>${FX('new = old − η × gradient')}<p>A negative gradient means the weight goes <b>up</b>: −0.5 − 0.2(−0.6) = −0.38.</p>`,

ex:[['intro','num',1],['intro','mcq',7],['cnn','mcq',3],['trans','mcq',15]]},
{badge:'In 2 of 4 sheets',t:'6 · Conv and pool shapes',spot:'An input size, a filter size, a stride, and "output shape".',

{badge:'In 2 of 4 sheets',t:'9 · Overfitting tools',spot:'Training accuracy high, test accuracy low. Or "how to improve generalization".',
body:`<p><b>Trap:</b> treating pruning, quantization and batch normalization as anti-overfitting tools. They mainly help size or training speed.</p><p><b>Rule:</b> for overfitting, name dropout, L1/L2, early stopping and data augmentation. For early stopping, read only the validation column.</p>`,

{badge:'In 2 of 4 sheets',t:'10 · Skip connections',spot:'"Very deep networks", "residual", "x + F(x)".',

{badge:'In 2 of 4 sheets',t:'11 · Why RNNs struggle',spot:'"Compare with RNN", "vanishing", "why were Transformers developed".',
body:`<p><b>Trap:</b> giving only one reason.</p><p><b>Rule:</b> name both: long-range information fades (vanishing gradients), and processing one step at a time blocks parallel training. LSTM and GRU ease the first. Transformers solve both, at n² attention cost.</p>`,

{t:'Cheat sheet · all 11 rules',
body:`<ul class="pts">
<li>1. Forward → Loss → Backprop → Update → Repeat.</li>
<li>2. Cross out options with only, always, guarantees, then check what is left.</li>
<li>3. new = old − η × gradient. A negative gradient raises the weight.</li>
<li>4. Softmax: e to each score, add, divide. Sums to 1.</li>
<li>5. ReLU in hidden layers, softmax at the output.</li>
<li>6. O = (N − F + 2P)/S + 1. Conv depth = filters. Pool keeps depth.</li>
<li>7. Convolution = cell by cell, one number. Attention and FFN = row × column.</li>
<li>8. QKᵀ → ÷√dₖ → softmax each row → × V.</li>
<li>9. Overfitting: dropout, L1/L2, early stopping, augmentation. Stop at the lowest validation loss.</li>
<li>10. Skip connections = ResNet = x + F(x).</li>
<li>11. RNN weaknesses: fading long-range information and no parallelism.</li>
</ul>`},

<script>
const KEY='dl_study_v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}};
let st=Object.assign({tab:'home',pane:{},pos:{},mcq:{}},load());
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const PANES=[['cheat','Cheatsheet'],['mcq','MCQ'],['num','Numerical'],['essay','Essays']];
const L='ABCD';
const sheet=id=>SHEETS.find(s=>s.id===id);
const main=document.getElementById('main');

function nav(){
  const tabs=[['home','Home'],['tricks','Tricks'],...SHEETS.map(s=>[s.id,s.name])];
  document.getElementById('nav').innerHTML=tabs.map(([id,n])=>`<button data-tab="${id}" class="${st.tab===id?'on':''}">${n}</button>`).join('')+
    `<button class="timer${timer.run?' run':''}" id="tm">⏱ ${fmt(timer.left)}</button>`;
}
function crumb(parts){document.getElementById('crumb').textContent=parts.join(' › ')}
function stepBar(n,total){
  return `<div class="bar"><button class="btn" data-step="-1" ${n===0?'disabled':''}>◀ Back</button><span class="n">${n+1} / ${total}</span><button class="btn" data-step="1" ${n===total-1?'disabled':''}>Next ▶</button></div><div class="prog"><i style="width:${(n+1)/total*100}%"></i></div>`;
}
function next2(n,total){return `<div class="next2"><button class="btn primary" data-step="1" ${n===total-1?'disabled':''}>Next ▶</button></div>`}

function render(){
  nav();
  if(st.tab==='home')return home();
  if(st.tab==='tricks')return tricks();
  const s=sheet(st.tab); if(!s){st.tab='home';return home()}
  const pane=st.pane[s.id]||'cheat';
  const label=PANES.find(p=>p[0]===pane)[1];
  let html=`<div class="sub">${PANES.map(([id,n])=>{const c=id==='cheat'?'':` (${s[id].length})`;return `<button data-pane="${id}" class="${pane===id?'on':''}">${n}${c}</button>`}).join('')}</div>`;
  if(pane==='cheat'){crumb([s.name,label]);html+=cheat(s)}
  else{
    const items=s[pane];const key=s.id+'.'+pane;
    let n=Math.min(st.pos[key]||0,items.length-1);st.pos[key]=n;
    crumb([s.name,label,(n+1)+' / '+items.length]);
    html+=stepBar(n,items.length);
    if(pane==='mcq')html+=mcqScore(s)+dots(s,n)+mcq(s,items[n],n);
    if(pane==='num')html+=num(items[n],n);
    if(pane==='essay')html+=essay(items[n],n);
    html+=next2(n,items.length);
  }
  main.innerHTML=html;
  save();
}
function mcqScore(s){
  const a=st.mcq[s.id]||{};const done=Object.keys(a).length;
  const right=Object.keys(a).filter(i=>a[i]===s.mcq[i][2]).length;
  return `<div class="muted">Score: <b>${right}</b> right out of ${done} answered ${done?`· <button class="go" data-reset="${s.id}">reset</button>`:''}</div>`;
}
function dots(s,n){
  const a=st.mcq[s.id]||{};
  return `<div class="dots">${s.mcq.map((q,i)=>{let c=i===n?'cur ':'';if(a[i]!==undefined)c+=a[i]===q[2]?'r':'w';return `<button class="${c}" data-jump="${i}" aria-label="Question ${i+1}">${i+1}</button>`}).join('')}</div>`;
}
function mcq(s,q,n){
  const a=(st.mcq[s.id]||{})[n];const done=a!==undefined;
  const o=q[1].map((t,i)=>{let c='';if(done){if(i===q[2])c='right';else if(i===a)c='wrong'}return `<button class="opt ${c}" data-pick="${i}" ${done?'disabled':''}><b>${L[i]}</b><span>${t}</span></button>`}).join('');
  return `<div class="card"><span class="qno">MCQ ${n+1}</span><p class="qt">${q[0]}</p>${o}${done?`<div class="why"><b>${a===q[2]?'Correct':'Answer: '+L[q[2]]}.</b> ${q[3]}</div>`:''}</div>`;
}
function num(p,n){
  const steps=p.steps.map(s=>`<li class="hid"><div class="st-h">${s[0]}</div>${s[1]?FX(s[1]):''}${s[2]?`<div class="st-why">${s[2]}</div>`:''}</li>`).join('');
  return `<div class="card" id="prob"><span class="qno">Problem ${n+1}</span><h2>${p.t}</h2><p class="qt" style="font-weight:400">${p.q}</p>
  <div class="btns"><button class="btn primary" data-reveal="next">Show first step</button><button class="btn" data-reveal="all">Show all steps</button></div>
  <div class="reveal hid"><div class="muted" style="margin-top:12px">Formula to use</div><div class="use">${p.use}</div></div>
  <ol class="steps">${steps}</ol>
  <div class="ans hid">Answer: ${p.ans}</div>${p.tip?`<div class="tip hid">${p.tip}</div>`:''}</div>`;
}
function essay(e,n){
  const pts=e.pts.map(x=>`<li><b class="h">${x[0]}</b>${x[1]}</li>`).join('');
  return `<div class="card"><span class="qno">Essay ${n+1}</span><p class="qt">${e.q}</p>
  <div class="btns" id="eb"><button class="btn primary" data-show="ea">Show answer</button></div>
  <div class="reveal hid" id="ea"><p class="key" style="margin-top:12px">${e.key}</p>${e.fig||''}<ul class="pts">${pts}</ul>${e.extra||''}${e.tip?`<div class="tip">${e.tip}</div>`:''}</div></div>`;
}
function cheat(s){
  const groups=s.cheat.map(g=>`<div class="card"><h2>${g.h}</h2>${g.rows.map(r=>`<div class="chrow"><div class="l">${r[0]}</div><div class="v"><div class="body">${r[1]}${r[2]?`<div class="nt">${r[2]}</div>`:''}</div></div></div>`).join('')}</div>`).join('');
  return `<div class="ch-tools"><button class="btn" id="selftest">${document.body.classList.contains('selftest')?'Self-test: on (click to reveal)':'Self-test: hide answers'}</button><button class="btn" id="print">Print cheatsheet</button></div>${groups}`;
}
function tricks(){
  const key='tricks';let n=Math.min(st.pos[key]||0,TRICKS.length-1);st.pos[key]=n;
  const t=TRICKS[n];crumb(['Tricks',(n+1)+' / '+TRICKS.length]);
  const links=(t.ex||[]).map(e=>`<button class="go" data-go="${e[0]}.${e[1]}.${e[2]}">${sheet(e[0]).name} ${e[1]==='mcq'?'MCQ':e[1]==='num'?'Problem':'Essay'} ${e[2]+1}</button>`).join('');
  main.innerHTML=stepBar(n,TRICKS.length)+`<div class="card">${t.badge?`<span class="badge">${t.badge}</span>`:''}<h2 style="margin-top:6px">${t.t}</h2>${t.spot?`<p><b>How to spot it:</b> ${t.spot}</p>`:''}${t.body}${links?`<h3>Practise it</h3><div class="golist">${links}</div>`:''}</div>`+next2(n,TRICKS.length);
  save();
}
function home(){
  crumb(['Home']);
  main.innerHTML=`<h1>Deep Learning: exam study</h1><p class="muted">4 sheets · 80 MCQs · 40 numerical problems · 40 essays, all answered</p>
  <div class="sheets">${SHEETS.map(s=>{const a=st.mcq[s.id]||{};const d=Object.keys(a).length;const r=Object.keys(a).filter(i=>a[i]===s.mcq[i][2]).length;return `<button data-tab="${s.id}"><b>${s.name}</b><span class="muted">${s.full}<br>MCQ: ${r} right of ${d} answered</span></button>`}).join('')}</div>
  <div class="card"><h2>A good 45-minute round</h2>
  <ul class="pts">
  <li><b class="h">1. Cheatsheet</b>Read it once, then press Self-test and say each formula before you reveal it.</li>
  <li><b class="h">2. MCQs</b>Answer without looking, then read why. Redo the red ones tomorrow.</li>
  <li><b class="h">3. Numerical</b>Work the problem on paper first. Then reveal one step at a time and stop at your first mistake.</li>
  <li><b class="h">4. Essays</b>Say or sketch your outline, then compare it with the answer.</li>
  </ul></div>
  <div class="card"><b>Short on time?</b> <button class="go" data-tab="tricks">Go to Tricks</button>: the patterns that repeat across sheets, most frequent first.</div>
  <details class="card"><summary>Problems I found in the source files (${SOURCE_NOTES.length})</summary><ul class="pts" style="margin-top:8px">${SOURCE_NOTES.map(x=>`<li><b class="h">${x[0]}</b>${x[1]}</li>`).join('')}</ul></details>
  <p class="muted">Keys: ← → move between questions · A–D answer an MCQ · Space reveals the next step or answer.</p>`;
  save();
}
/* timer */
const timer={left:900,run:false,id:null};
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){
  timer.left--;
  if(timer.left<=0){clearInterval(timer.id);timer.run=false;timer.left=900;document.getElementById('brk').innerHTML='<div class="break">15 minutes done. Take a 5-minute break: stand up and look away from the screen.</div>';}
  const b=document.getElementById('tm');if(b){b.textContent='⏱ '+fmt(timer.left);b.classList.toggle('run',timer.run)}
}
function revealNext(all){
  const c=document.getElementById('prob');if(!c)return false;
  const hidden=[...c.querySelectorAll('.reveal.hid, ol.steps>li.hid, .ans.hid, .tip.hid')];
  if(!hidden.length)return false;
  (all?hidden:hidden.slice(0,hidden[0].classList.contains('reveal')?2:1)).forEach(x=>x.classList.remove('hid'));
  const rest=c.querySelectorAll('.reveal.hid, ol.steps>li.hid, .ans.hid, .tip.hid').length;
  const nb=c.querySelector('[data-reveal="next"]');
  if(!rest)c.querySelector('.btns').style.display='none';else nb.textContent='Next step';
  return true;
}
function step(d){
  const key=st.tab==='tricks'?'tricks':st.tab+'.'+(st.pane[st.tab]||'cheat');
  const total=st.tab==='tricks'?TRICKS.length:(sheet(st.tab)||{})[st.pane[st.tab]]?.length;
  if(!total)return;
  const n=(st.pos[key]||0)+d;if(n<0||n>=total)return;
  st.pos[key]=n;render();scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-show]');
  const v=e.target.closest('.v');
  if(v&&document.body.classList.contains('selftest')){v.classList.toggle('shown');return}
  if(!b)return;
  if(b.id==='tm'){if(timer.run){clearInterval(timer.id);timer.run=false}else{timer.run=true;timer.id=setInterval(tick,1000);document.getElementById('brk').innerHTML=''}b.classList.toggle('run',timer.run);return}
  if(b.id==='selftest'){document.body.classList.toggle('selftest');document.querySelectorAll('.v.shown').forEach(x=>x.classList.remove('shown'));b.textContent=document.body.classList.contains('selftest')?'Self-test: on (click to reveal)':'Self-test: hide answers';return}
  if(b.id==='print'){window.print();return}
  const d=b.dataset;
  if(d.tab){st.tab=d.tab;render();scrollTo(0,0)}
  else if(d.pane){st.pane[st.tab]=d.pane;render();scrollTo(0,0)}
  else if(d.step)step(+d.step);
  else if(d.jump!==undefined){st.pos[st.tab+'.mcq']=+d.jump;render()}
  else if(d.pick!==undefined){const s=sheet(st.tab);const n=st.pos[s.id+'.mcq']||0;(st.mcq[s.id]=st.mcq[s.id]||{})[n]=+d.pick;render()}
  else if(d.reset){delete st.mcq[d.reset];st.pos[d.reset+'.mcq']=0;render()}
  else if(d.reveal){revealNext(d.reveal==='all')}
  else if(d.show){document.getElementById(d.show).classList.remove('hid');const eb=document.getElementById('eb');if(eb)eb.style.display='none'}
  else if(d.go){const[a,p,i]=d.go.split('.');st.tab=a;st.pane[a]=p;st.pos[a+'.'+p]=+i;render();scrollTo(0,0)}
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowRight')step(1);
  else if(e.key==='ArrowLeft')step(-1);
  else if(e.key===' '){
    if(document.getElementById('prob')){if(revealNext(false))e.preventDefault()}
    else{const x=document.querySelector('[data-show]');if(x&&x.offsetParent){x.click();e.preventDefault()}}
  }
  else if(/^[a-dA-D]$/.test(e.key)&&st.tab!=='home'&&st.pane[st.tab]==='mcq'){const o=document.querySelector(`[data-pick="${L.indexOf(e.key.toUpperCase())}"]`);if(o&&!o.disabled)o.click()}
});
render();
</script>
</body>
</html>
